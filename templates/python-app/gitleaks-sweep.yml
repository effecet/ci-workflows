name: gitleaks-sweep
on:
  schedule:
    - cron: "{CRON_MINUTE} 3 * * 1"   # Monday 03:XX UTC (stagger computed at render time)
  workflow_dispatch:

jobs:
  sweep:
    runs-on: {RUNS_ON_SWEEP}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history — this is the sweep
      - name: Ensure gitleaks (baked, else retry-curl)
        run: |
          # Same block as gitleaks-fast: a runner image with gitleaks 8.30.1
          # baked in needs ZERO network. Any
          # other runner: retry-wrapped (3x, backoff) curl of the pinned static
          # binary. Cross-arch: uname -m -> aarch64 on ARM, x86_64 on x64.
          if command -v gitleaks >/dev/null 2>&1; then exit 0; fi
          case "$(uname -m)" in
            aarch64|arm64) GL_ARCH=arm64 ;;
            x86_64|amd64)  GL_ARCH=x64 ;;
