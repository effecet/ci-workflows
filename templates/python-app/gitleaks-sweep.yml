          esac
          for i in 1 2 3; do
            if curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${GL_ARCH}.tar.gz" \
              | tar -xz -C /usr/local/bin gitleaks; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "gitleaks unavailable after retries"; exit 1
      - name: Gitleaks (full history)
        run: |
          CONFIG_ARGS=()
          if [ -f .gitleaks.toml ]; then CONFIG_ARGS+=(--config .gitleaks.toml); fi
          gitleaks detect "${CONFIG_ARGS[@]}" --source . --exit-code 1 --verbose

