name: claude

# Claude Code on this repo:
#   - review:  automatic review of every PR opened from a branch of this repo
#   - mention: answers "@claude ..." in issues and PR comments from the owner
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret (`claude setup-token`). Without
# it every job exits early and green, so CI never goes red over a missing key.
# Fork PRs and Dependabot PRs get no secrets on GitHub, so they are skipped too.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set; skipping Claude review"; fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory.
            Focus, in order: correctness bugs, security (secrets, hostnames, personal paths,
            injection), contract or behaviour changes not reflected in README/diagrams, then
            test gaps. Skip style nits a linter would catch. If nothing is wrong, say so briefly.

            Use `gh pr comment` for one top-level summary.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for specific lines. Only post GitHub comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    # Owner-only: on a public repo anyone can comment, and every run spends the token.
    if: >-
      github.event_name != 'pull_request' &&
      contains(github.event.comment.body || github.event.issue.body, '@claude') &&
      (github.event.comment.author_association || github.event.issue.author_association) == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set; skipping @claude"; fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
