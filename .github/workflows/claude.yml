name: claude

# Answers "@claude ..." in issues and PR comments, from the repo owner only.
# PR reviews live in claude-review.yml.
#
# Owner-only: on a public repo anyone can comment, and every run spends the
# CLAUDE_CODE_OAUTH_TOKEN. Without that secret the job exits green.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  mention:
    if: >-
      contains(github.event.comment.body || github.event.issue.body, '@claude') &&
      (github.event.comment.author_association || github.event.issue.author_association) == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set; skipping @claude"; fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
